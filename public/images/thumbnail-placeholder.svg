<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" fill="none">
  <rect width="1600" height="900" fill="#FFFFFF" />

  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#F1F5F9" stroke-width="1" />
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#grid)" />

  <g transform="translate(800 450)">
    <rect x="-300" y="-110" width="220" height="130" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2" />
    <line x1="-300" y1="-70" x2="-80" y2="-70" stroke="#E2E8F0" stroke-width="2" />
    <line x1="-270" y1="-40" x2="-110" y2="-40" stroke="#F1F5F9" stroke-width="8" stroke-linecap="round" />
    <line x1="-270" y1="-10" x2="-150" y2="-10" stroke="#F1F5F9" stroke-width="8" stroke-linecap="round" />
    <line x1="-270" y1="20" x2="-190" y2="20" stroke="#F1F5F9" stroke-width="8" stroke-linecap="round" />

    <rect x="80" y="-90" width="200" height="110" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2" />
    <line x1="80" y1="-50" x2="280" y2="-50" stroke="#E2E8F0" stroke-width="2" />
    <line x1="110" y1="-20" x2="250" y2="-20" stroke="#F1F5F9" stroke-width="8" stroke-linecap="round" />
    <line x1="110" y1="10" x2="210" y2="10" stroke="#F1F5F9" stroke-width="8" stroke-linecap="round" />

    <rect x="-40" y="40" width="240" height="120" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2" />
    <line x1="-40" y1="80" x2="200" y2="80" stroke="#E2E8F0" stroke-width="2" />
    <line x1="-10" y1="110" x2="170" y2="110" stroke="#F1F5F9" stroke-width="8" stroke-linecap="round" />
    <line x1="-10" y1="140" x2="130" y2="140" stroke="#F1F5F9" stroke-width="8" stroke-linecap="round" />

    <path d="M -80 -45 L 80 -45" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="6 6" />
    <path d="M 90 20 L 90 40" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="6 6" />
    <path d="M -190 20 L -40 80" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="6 6" />

    <circle cx="-80" cy="-45" r="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" />
    <circle cx="80" cy="-45" r="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" />
    <circle cx="90" cy="20" r="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" />
    <circle cx="90" cy="40" r="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" />
    <circle cx="-190" cy="20" r="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" />
    <circle cx="-40" cy="80" r="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" />
  </g>
